# Butterfly 主题配置
# 只写与主题默认值不同的部分，其余继承 node_modules/hexo-theme-butterfly/_config.yml
# （Hexo 会把本文件深合并到主题默认配置上）

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open

avatar:
  img: https://avatars.githubusercontent.com/u/343016386?v=4
  # false = 页面上不再一直转；悬停时的旋转交给 source/custom/avatar.css
  effect: false

favicon: https://avatars.githubusercontent.com/u/343016386?v=4

social:
  fab fa-github: https://github.com/Dolphin-ocean08 || Github || '#24292e'

search:
  use: local_search
  placeholder: 搜索文章

# 自定义样式 / 脚本注入
inject:
  head:
    - '<link rel="stylesheet" href="/custom/avatar.css">'
  bottom:
    - '<div style="position:fixed;left:20px;bottom:50px;z-index:9999;width:330px;height:86px;border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35);"><iframe frameborder="no" border="0" marginwidth="0" marginheight="0" width="330" height="86" style="display:block;border:0" src="//music.163.com/outchain/player?type=0&id=18558771019&auto=0&height=66"></iframe></div>'
